name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: '自訂額外 Tag (例如 v1.6，留空則依觸發條件產生 latest 或 tag)'
        required: false
        default: ''


jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登入 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 計算 Docker 標籤 (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: eeyellow/twse
          tags: |
            # master 推送或建立 tag 時，皆同步更新 latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
            # 推送 Git Tag 時，直接使用原始 Tag 名稱 (例如 v1.6)
            type=ref,event=tag
            # 手動觸發時若有輸入 custom_tag
            type=raw,value=${{ github.event.inputs.custom_tag }},enable=${{ github.event.inputs.custom_tag != '' }}


      - name: 建置並推送映像檔
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 啟用 GitHub Actions 快取以大幅加速 build 流程
          cache-from: type=gha
          cache-to: type=gha,mode=max
